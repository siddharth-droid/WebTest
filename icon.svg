<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#02040a"/>
  <defs>
    <linearGradient id="earth" x1="0.2" y1="0.15" x2="0.8" y2="0.9">
      <stop offset="0" stop-color="#9fdcff"/>
      <stop offset="0.55" stop-color="#2f74d0"/>
      <stop offset="1" stop-color="#0b2a66"/>
    </linearGradient>
  </defs>
  <!-- back half of the orbit, behind the planet -->
  <ellipse cx="32" cy="32" rx="26" ry="9.5" transform="rotate(-24 32 32)" fill="none" stroke="#e8edf5" stroke-opacity="0.35" stroke-width="2.4"/>
  <circle cx="32" cy="32" r="14" fill="url(#earth)"/>
  <!-- front half of the orbit, over the planet -->
  <path d="M8.3 42.6 A26 9.5 -24 0 0 55.7 21.4" fill="none" stroke="#e8edf5" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="55.2" cy="26.1" r="4.2" fill="#ffffff"/>
  <circle cx="55.2" cy="26.1" r="7" fill="#9fdcff" fill-opacity="0.25"/>
</svg>
