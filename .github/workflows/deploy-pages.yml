name: Deploy to GitHub Pages

# Fetches open space data, builds the static export and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main]
  # Refresh the open data every 3 hours (CelesTrak asks for no more than every 2)
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch open data
        run: node scripts/fetch-data.mjs
        env:
          FALLBACK_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Build Earth textures
        run: node scripts/fetch-earth-textures.mjs
        env:
          FALLBACK_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: 1
      # Without this, Pages' Jekyll step drops the _next/ folder
      - run: touch out/.nojekyll
      - name: Publish to gh-pages
        working-directory: out
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
